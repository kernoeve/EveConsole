# EVE Console — self-hosted background worker with its PostgreSQL server
#
#   cp .env.example .env        # then set a password in it
#   docker compose up -d --build
#   docker compose logs -f worker
#
# The worker does the background work (ESI polling, pricing, contracts, zKillboard, alarms, the
# scheduler, retention, backups) for every client sharing this database. Desktop clients connect
# to the same server — Settings ▸ Database ▸ PostgreSQL, host = this machine, port below — and
# read; while this worker holds the lease they do no background work of their own.
#
# ⚠️ Characters and corporations are added from a desktop client. Signing in to EVE goes through a
# browser, and this container has none; once added they are in the database, and the worker polls
# them from then on.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: eveconsole
      POSTGRES_USER: eveconsole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    # ⚠️ Published so desktop clients on other machines can reach it. This is your whole EVE Console
    # database, refresh tokens included: keep it to your own network, or delete this and use
    # "127.0.0.1:5432:5432" if the only client is on this machine.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveconsole -d eveconsole"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      args:
        # ⚠️ The version your desktop clients run. See the Dockerfile.
        EVECONSOLE_VERSION: ${EVECONSOLE_VERSION:-latest}
        PG_MAJOR: "17"   # the postgres image above
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ⚠️ The connection from the environment, not from saved settings: a saved password lives in
      # a desktop keyring, and a container has none.
      EVECONSOLE_DB_CONNECTION: Host=db;Port=5432;Database=eveconsole;Username=eveconsole;Password=${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
      # EVE game and chat logs, if this machine has them (see the volumes below). Naming them is
      # what switches import on; a worker with none simply imports none, and the desktop clients
      # go on reading their own.
      # EVECONSOLE_GAMELOG_DIRS: /eve/Gamelogs
      # EVECONSOLE_CHATLOG_DIRS: /eve/Chatlogs
    volumes:
      # Config, the SDE cache, pictures and the pg_dump backups.
      - data:/data
      # - /path/to/EVE/logs/Gamelogs:/eve/Gamelogs:ro
      # - /path/to/EVE/logs/Chatlogs:/eve/Chatlogs:ro
    # ⚠️ Time to answer SIGTERM. The worker releases its lease on the way out, so a desktop client
    # takes the work over on its next tick rather than after the server notices a dropped socket.
    stop_grace_period: 30s

volumes:
  db:
  data:
