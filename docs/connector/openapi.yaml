openapi: 3.0.3
info:
  title: EVE Console connector interface
  version: "1"
  description: |
    What EVE Console asks of a connector. See README.md beside this file for connecting, checking the
    EVE token, keys, and errors.
servers:
  - url: http://localhost:5054
    description: A connector on the same PC (suggested default port)
security:
  - connectorKey: []
paths:
  /v1/info:
    get:
      summary: What this is, and which interface versions it speaks
      security: []
      responses:
        "200":
          description: A connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /v1/auth/start:
    post:
      summary: Start a sign-in on the connector's own page
      description: |
        The connector runs EVE's sign-in itself, with its own EVE application and callback. EVE Console shows
        the user `code` and opens `loginUrl`; the page shows the same code and asks the user to confirm it
        before going to EVE. See README.md.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  example: EVE Console
      responses:
        "200":
          description: A sign-in, waiting for the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStarted"
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/poll:
    post:
      summary: How a sign-in is going; the key once it is done
      description: |
        `pending` until the sign-in ends; then the final answer, once, after which the sign-in is forgotten.
        The secret travels in the body, never in the address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, pollSecret]
              properties:
                loginId: { type: string }
                pollSecret: { type: string }
      responses:
        "200":
          description: The sign-in's state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginState"
        "404": { $ref: "#/components/responses/Error" }
  /v1/auth/sign-out:
    post:
      summary: End the key this call was made with
      responses:
        "204":
          description: Ended
        "401": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      summary: Who the key is for, and what this connector offers them
      responses:
        "200":
          description: The character and the capabilities it may use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/linked-characters:
    get:
      summary: Every account and its characters, as the connector's source has them
      description: Capability `linked-characters`. The whole set; EVE Console replaces what it had for the source.
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedCharacters"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    connectorKey:
      type: http
      scheme: bearer
      description: The key from a finished sign-in (/v1/auth/poll)
  responses:
    Error:
      description: Refused
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Info:
      type: object
      required: [interface, versions]
      properties:
        interface:
          type: string
          enum: [eveconsole.connector]
        versions:
          type: array
          items: { type: integer }
          example: [1]
        name:
          type: string
          description: Shown to the user, e.g. "Example Corp Connector"
    Character:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    LoginStarted:
      type: object
      required: [loginId, pollSecret, loginUrl, code]
      properties:
        loginId: { type: string }
        pollSecret:
          type: string
          description: At least 128 random bits. Only in request bodies, never in an address.
        loginUrl:
          type: string
          description: The connector's page for this sign-in. https unless the connector is on the user's PC.
        code:
          type: string
          example: K7P-4QX
        interval:
          type: number
          default: 2
          description: Seconds between polls
        expiresIn:
          type: number
          default: 600
          maximum: 900
          description: Seconds before an unfinished sign-in expires
    LoginState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, done, refused, declined, expired]
        key:
          type: string
          description: With done. At least 256 random bits. Given once; the connector keeps only a hash.
        character:
          $ref: "#/components/schemas/Character"
        error:
          type: string
          description: With refused, e.g. not_allowed or eve_token_invalid
        message:
          type: string
    Me:
      type: object
      required: [character, capabilities]
      properties:
        character:
          $ref: "#/components/schemas/Character"
        capabilities:
          type: array
          items: { type: string }
          example: [linked-characters]
    LinkedCharacters:
      type: object
      required: [format, version, source, generatedAt, accounts]
      properties:
        format:
          type: string
          enum: [eveconsole.linked-characters]
        version:
          type: integer
          example: 1
        source:
          type: string
          maxLength: 64
        generatedAt:
          type: string
          format: date-time
          description: When the connector read the links, not when it answered
        accounts:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer, format: int64, minimum: 1 }
              name: { type: string }
              characters:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: integer, format: int64, minimum: 1 }
                    name: { type: string }
                    main: { type: boolean, default: false }
                    corporationId: { type: integer, format: int32, minimum: 0 }
                    allianceId: { type: integer, format: int32, description: 0 or missing for none }
                    tokenValid: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_request, not_signed_in, not_allowed, not_offered, login_unknown, too_many_logins, eve_unavailable, source_unavailable]
        message:
          type: string
          description: English, shown only for a code EVE Console does not know
