openapi: 3.0.3
info:
  title: EVE Console connector interface
  version: "1"
  description: |
    What EVE Console asks of a connector. See README.md beside this file for connecting, keys, who may
    see what, errors, and the rules each answer must follow.
servers:
  - url: http://localhost:5054
    description: A connector on the same PC (suggested default port)
security:
  - connectorKey: []
paths:
  /v1/info:
    get:
      summary: What this is, and which interface versions it speaks
      security: []
      responses:
        "200":
          description: A connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /v1/auth/start:
    post:
      summary: Start a sign-in on the connector's own page
      description: |
        The connector runs EVE's sign-in itself, with its own EVE application and callback. EVE Console shows
        the user `code` and opens `loginUrl`; the page shows the same code and asks the user to confirm it
        before going to EVE. See README.md.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  example: EVE Console
      responses:
        "200":
          description: A sign-in, waiting for the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStarted"
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/poll:
    post:
      summary: How a sign-in is going; the key once it is done
      description: |
        `pending` until the sign-in ends; then the final answer, once, after which the sign-in is forgotten.
        The secret travels in the body, never in the address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, pollSecret]
              properties:
                loginId: { type: string }
                pollSecret: { type: string }
      responses:
        "200":
          description: The sign-in's state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginState"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/auth/sign-out:
    post:
      summary: End the key this call was made with
      responses:
        "204":
          description: Ended
        "401": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      summary: Who the key is for, and what this connector offers them
      responses:
        "200":
          description: The character, its capabilities, and what each covers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/linked-characters:
    get:
      summary: The caller's own account, with its characters
      description: |
        Capability `linked-characters`. Only the caller's own account; anyone else's is read one at a time
        with /v1/characters/{character_id}/account. EVE Console replaces what it had with this answer.
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedCharacters"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/characters/{character_id}/account:
    get:
      summary: The account holding this character, with all its characters
      description: |
        Capability `linked-characters`. Exactly one entry in `accounts`. For someone else, recorded by the
        connector; EVE Console keeps it apart from the caller's own links.
      parameters:
