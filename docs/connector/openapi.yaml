components:
  securitySchemes:
    connectorKey:
      type: http
      scheme: bearer
      description: The key from a finished sign-in (/v1/auth/poll)
  headers:
    X-Pages:
      description: The number of pages, on a paged answer
      schema: { type: integer, minimum: 1 }
    Expires:
      description: ESI's, passed on. EVE Console does not ask again before it.
      schema: { type: string }
    Last-Modified:
      description: ESI's, passed on
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before trying again
      schema: { type: integer, minimum: 0 }
  parameters:
    character_id:
      name: character_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    corporation_id:
      name: corporation_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    group_id:
      name: group_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    contract_id:
      name: contract_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    division:
      name: division
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 7 }
    page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    from:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    include_completed:
      name: include_completed
      in: query
      required: false
      description: Passed on to ESI
      schema: { type: boolean }
    from_id:
      name: from_id
      in: query
      required: false
      description: Passed on to ESI
      schema: { type: integer, format: int64 }
    labels:
      name: labels
      in: query
      required: false
      description: Passed on to ESI as ESI takes it (repeated `labels=`)
      schema:
        type: array
        minItems: 1
        maxItems: 25
        uniqueItems: true
        items: { type: integer, format: int64 }
    last_mail_id:
      name: last_mail_id
      in: query
      required: false
      description: Passed on to ESI
      schema: { type: integer, format: int64 }
    compatibilityDate:
      name: X-Compatibility-Date
      in: header
      required: false
      description: |
        ESI's compatibility date. The connector sends ESI its own copy of it and keys its cache on it; a date
        it does not support, or anything else, is bad_request. Without it, the connector's own default date.
      schema: { type: string, format: date, example: "2026-08-01" }
  responses:
    Error:
      description: Refused
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Esi:
      description: ESI's own JSON body for the same path, unchanged
      headers:
        X-Pages: { $ref: "#/components/headers/X-Pages" }
        Expires: { $ref: "#/components/headers/Expires" }
        Last-Modified: { $ref: "#/components/headers/Last-Modified" }
      content:
        application/json:
          schema:
            description: As ESI documents it for the path and compatibility date
  schemas:
    Info:
      type: object
      required: [interface, versions]
      properties:
        interface:
          type: string
          enum: [eveconsole.connector]
        versions:
          type: array
          items: { type: integer }
          example: [1]
        name:
          type: string
          description: Shown to the user, e.g. "Example Corp Connector"
    Character:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    LoginStarted:
      type: object
      required: [loginId, pollSecret, loginUrl, code]
      properties:
        loginId: { type: string }
        pollSecret:
          type: string
          description: At least 128 random bits. Only in request bodies, never in an address.
        loginUrl:
          type: string
          description: The connector's page for this sign-in. https unless the connector is on the user's PC.
        code:
          type: string
          example: K7P-4QX
        interval:
          type: number
          default: 2
          description: Seconds between polls
        expiresIn:
          type: number
          default: 600
          maximum: 900
          description: Seconds before an unfinished sign-in expires
    LoginState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, done, refused, declined, expired]
        key:
          type: string
          description: With done. At least 256 random bits. Given once; the connector keeps only a hash.
        character:
          $ref: "#/components/schemas/Character"
        error:
          type: string
          description: With refused, e.g. not_allowed or eve_token_invalid
        message:
          type: string
    Me:
      type: object
      required: [character, capabilities]
      properties:
        character:
          $ref: "#/components/schemas/Character"
        capabilities:
          type: array
          items: { type: string, pattern: "^[a-z0-9-]+$" }
          example: [linked-characters, groups, character-data, corporation-data, fleet-participation]
        offers:
          type: array
          description: |
            Without it, each listed character capability is read as offered for `own` only, with no ESI
            calls, and no corporation data is offered.
          items:
            $ref: "#/components/schemas/Offer"
    Offer:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          example: character-data
        subjects:
          type: string
          enum: [own, others]
          default: own
          description: |
            `own`: characters on the caller's own account. `others`: other characters, when the connector's
            rules allow this caller; decided on each call.
        corporations:
          type: array
          description: |
            For corporation-data and the corporation fleet-participation call, the corporations this offer
            covers. Missing means none.
          items: { type: integer, format: int64, minimum: 1 }
        data:
          type: array
          description: |
            For character-data and corporation-data, the ESI paths answered, as listed in README.md. Missing
            means none.
          items: { type: string }
          example: [assets, wallet, wallet/journal]
    LinkedCharacters:
      type: object
      required: [format, version, source, generatedAt, accounts]
      properties:
        format:
          type: string
          enum: [eveconsole.linked-characters]
        version:
          type: integer
          enum: [1]
        source:
          type: string
          maxLength: 64
        generatedAt:
          type: string
          format: date-time
          description: When the connector read the links, not when it answered
        accounts:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer, format: int64, minimum: 1 }
              name: { type: string }
              characters:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: integer, format: int64, minimum: 1 }
                    name: { type: string }
                    main: { type: boolean, default: false }
                    corporationId: { type: integer, format: int32, minimum: 0 }
                    allianceId: { type: integer, format: int32, minimum: 0, description: 0 or missing for none }
                    tokenValid: { type: boolean }
    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, example: Capital pilots }
    GroupList:
      type: object
      required: [generatedAt, groups]
      properties:
        generatedAt: { type: string, format: date-time }
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
    AccountGroups:
      type: object
      required: [generatedAt, state, groups]
      properties:
        generatedAt: { type: string, format: date-time }
        accountId:
          type: integer
          format: int64
          minimum: 1
          description: |
            Left out for someone else unless the caller may read that account under linked-characters
        state:
          type: string
          enum: [active, deactivating, deactivated]
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
    GroupMembers:
      type: object
      required: [generatedAt, members]
      properties:
        generatedAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            description: At least one of accountId and main; a member with neither is not listed
            minProperties: 1
            properties:
              accountId:
                type: integer
                format: int64
                minimum: 1
                description: |
                  Left out for someone else unless the caller may read that account under
                  linked-characters
              main:
                $ref: "#/components/schemas/Character"
    CharacterFleets:
      type: object
      required: [generatedAt, fleets]
      properties:
        generatedAt: { type: string, format: date-time }
        fleets:
          type: array
          items:
            type: object
            required: [fleet, intervals]
            properties:
              fleet:
                type: object
                required: [id, startedAt, endedAt]
                properties:
                  id: { type: integer, format: int64, minimum: 1 }
                  name: { type: string }
                  type: { type: string, example: Strategic }
                  startedAt: { type: string, format: date-time }
                  endedAt: { type: string, format: date-time }
                  commanderId: { type: integer, format: int64 }
              intervals:
                type: array
                items:
                  type: object
                  required: [from, to]
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                    shipTypeId: { type: integer, format: int32 }
                    solarSystemId: { type: integer, format: int32 }
                    role:
                      type: string
                      enum: [fleet_commander, wing_commander, squad_commander, squad_member]
    CorporationParticipation:
      type: object
      required: [generatedAt, from, to, members]
      properties:
        generatedAt: { type: string, format: date-time }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            required: [characterId, fleets, seconds]
            properties:
              characterId: { type: integer, format: int64, minimum: 1 }
              accountId:
                type: integer
                format: int64
                minimum: 1
                description: |
                  Left out when unknown, or, for someone else, when the caller may not read that account
                  under linked-characters
              fleets: { type: integer, minimum: 0 }
              seconds: { type: integer, format: int64, minimum: 0 }
              lastFleetAt:
                type: string
                format: date-time
                description: The start of the latest counted fleet
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_request, not_signed_in, not_allowed, not_offered, not_found, login_unknown, no_token,
                 missing_scope, no_role, too_many_logins, rate_limited, esi_error, eve_unavailable,
                 source_unavailable]
        message:
          type: string
          description: English, shown only for a code EVE Console does not know
