name: docs

# Validation only. The site is built and deployed by Cloudflare Pages
# (production branch: main) — published at https://docs.eveconsole.com/.
# This job just fails a PR/push if the docs don't build cleanly.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements-docs.txt
      # --strict fails the build on broken links or pages missing from the nav.
      - run: mkdocs build --strict
