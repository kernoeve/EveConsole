name: PR Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ⚠️ fetch-depth: 0 is load-bearing, not tidiness. The upgrade check below reads the
      # previous releases' schema out of their tags with `git show`, and the default shallow
      # checkout carries no tags at all — the check would find no release to simulate and
      # abort rather than pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore EveConsole.csproj

      - name: Build
        run: dotnet build EveConsole.csproj -c Release --no-restore

      # Would this build start for someone who has never run EveConsole before?
      #
      # Cannot be answered by running the app here or on a developer machine, where the
      # database carries years of ALTER TABLE history. v0.9.10 shipped a startup crash
      # that only new users ever saw. Fails the check on any statement that would abort
      # startup or silently seed nothing.
      - name: Fresh-install check
        run: dotnet run --project tools/FreshInstallCheck/FreshInstallCheck.csproj -c Release

      # And would it work for someone who ALREADY HAS one? The mirror of the check above,
      # and the one that catches what it structurally cannot: on an existing database
      # EnsureCreated does nothing, so a column added to the model and to no hand-written
      # list is perfect on every fresh test install and missing for every real user.
      #
      # 0.9.13 shipped 81 such columns and two such tables. An existing database lost Wallet,
      # Sales Tracker, Order Tracker and the Worklist to "no such column", and Update SDE —
      # the one action that would have repaired the schema — died on the missing table first.
      - name: Upgrade check
        run: dotnet run --project tools/UpgradeCheck/UpgradeCheck.csproj -c Release

      # ⚠️ The agent's instructions are prose, and prose is code no compiler reads. The schema
      # notes documented MarketItemPrices as BuyMax/SellMin long after the real columns became
      # BuyPrice/SellPrice/Midpoint, and that cost two failed queries in a single conversation
      # before the agent worked around it. This checks every table and column NAMED in those
      # instructions against the entity model.
      #
      # ⚠️ Names only. It cannot tell whether a sentence about them is TRUE — the notes once
      # said CharacterAffiliations gives a character's current corporation, every identifier in
      # that claim was real, and the claim was wrong.
      - name: Agent context check
        run: dotnet run --project tools/AgentContextCheck/AgentContextCheck.csproj -c Release

      # ⚠️ Does a streamed agent turn stay off the UI thread? This has failed twice the same way:
      # one await in the streaming path without ConfigureAwait(false). The second time it was
      # the outer enumeration in StreamAsync, which captured the UI context and undid every
      # other one — a tool call the model took forty seconds to write froze the window for forty
      # seconds, and the capsuleer heard speech for text that had not appeared yet. A review
      # cannot see it. This runs the real provider against a fake streaming server from a thread
      # with a synchronization context installed, and fails on the first continuation posted
      # back to it.
      - name: Agent stream check
        run: dotnet run --project tools/AgentStreamCheck/AgentStreamCheck.csproj -c Release

      # ⚠️ Does a detail popup stay with the row that is showing its item? The DataGrid keeps
      # rows in the tree after they leave the screen — recycled in place, or parked when they
      # hold focus — and a popup anchored to one hangs at the old position while the item's new
      # row opens another. The worklist drew the same manifest twice whenever the clicked row
      # moved. This drives the real DataGrid, headless, through each way a row can go stale.
      - name: Row detail check
        run: dotnet run --project tools/RowDetailCheck/RowDetailCheck.csproj -c Release

  # ⚠️ Does the Linux target still compile?
  #
  # The job above answers that for Windows only — it is a windows-latest runner with no
  # RuntimeIdentifier, so it builds for its own host and nothing else. A package placed in
  # the IsWindowsTarget ItemGroup therefore vanishes from a Linux build without this check
  # noticing: Npgsql landed there in #89, the PR went green, and develop could not be built
  # on Linux at all (12 CS0246s).
  #
  # Nothing else catches it first. release-build.yml has a linux job, but that only runs
  # once develop has already reached main.
  #
  # A real runner rather than `-r linux-x64` from the Windows one: the piper download
  # targets in EveConsole.csproj are conditioned on the build HOST, so cross-compiling
  # produces an artifact that is not the one the release job produces.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # libvlc is the one dependency the app cannot carry itself — LibVLCSharp loads the
      # system copy. release-build.yml installs it on its linux job for the same reason.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev

      - name: Restore
        run: dotnet restore EveConsole.csproj

      - name: Build
        run: dotnet build EveConsole.csproj -c Release --no-restore
