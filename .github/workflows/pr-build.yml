name: PR Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ⚠️ fetch-depth: 0 is load-bearing, not tidiness. The upgrade check below reads the
      # previous releases' schema out of their tags with `git show`, and the default shallow
      # checkout carries no tags at all — the check would find no release to simulate and
      # abort rather than pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EveConsole.csproj

      - name: Build
        run: dotnet build EveConsole.csproj -c Release --no-restore

      # Would this build start for someone who has never run EveConsole before?
      #
      # Cannot be answered by running the app here or on a developer machine, where the
      # database carries years of ALTER TABLE history. v0.9.10 shipped a startup crash
      # that only new users ever saw. Fails the check on any statement that would abort
      # startup or silently seed nothing.
      - name: Fresh-install check
        run: dotnet run --project tools/FreshInstallCheck/FreshInstallCheck.csproj -c Release

      # And would it work for someone who ALREADY HAS one? The mirror of the check above,
      # and the one that catches what it structurally cannot: on an existing database
      # EnsureCreated does nothing, so a column added to the model and to no hand-written
      # list is perfect on every fresh test install and missing for every real user.
      #
      # 0.9.13 shipped 81 such columns and two such tables. An existing database lost Wallet,
      # Sales Tracker, Order Tracker and the Worklist to "no such column", and Update SDE —
      # the one action that would have repaired the schema — died on the missing table first.
      - name: Upgrade check
        run: dotnet run --project tools/UpgradeCheck/UpgradeCheck.csproj -c Release

      # ⚠️ The agent's instructions are prose, and prose is code no compiler reads. The schema
      # notes documented MarketItemPrices as BuyMax/SellMin long after the real columns became
      # BuyPrice/SellPrice/Midpoint, and that cost two failed queries in a single conversation
      # before the agent worked around it. This checks every table and column NAMED in those
      # instructions against the entity model.
      #
      # ⚠️ Names only. It cannot tell whether a sentence about them is TRUE — the notes once
      # said CharacterAffiliations gives a character's current corporation, every identifier in
      # that claim was real, and the claim was wrong.
      - name: Agent context check
        run: dotnet run --project tools/AgentContextCheck/AgentContextCheck.csproj -c Release

      # ⚠️ Does a streamed agent turn stay off the UI thread? This has failed twice the same way:
      # one await in the streaming path without ConfigureAwait(false). The second time it was
      # the outer enumeration in StreamAsync, which captured the UI context and undid every
      # other one — a tool call the model took forty seconds to write froze the window for forty
      # seconds, and the capsuleer heard speech for text that had not appeared yet. A review
      # cannot see it. This runs the real provider against a fake streaming server from a thread
      # with a synchronization context installed, and fails on the first continuation posted
      # back to it.
      - name: Agent stream check
        run: dotnet run --project tools/AgentStreamCheck/AgentStreamCheck.csproj -c Release

      # ⚠️ Does the web store's copy of the palette still match Themes/Palette.axaml? A store's
      # site is themed from WebThemes, a table of the XAML's colours — a copy, because the site
      # wears the STORE's theme resolved by key, never the desktop's, and the client pushing it
      # may be headless with no resource dictionary loaded. A colour adjusted in one and not the
      # other would ship silently; this reads the XAML as XML and fails on the first difference.
      - name: Web themes check
        run: dotnet run --project tools/WebThemesCheck/WebThemesCheck.csproj -c Release

      # ⚠️ Is every translation safe to show? A translation that drops a placeholder — "{0} jobs"
      # as a sentence without {0} — throws the moment its label is drawn, in that language only,
      # so testing in English never meets it. The build cannot see it either: a translation is
      # data, not code. This fails on lost or extra placeholders, broken braces, keys the English
      # does not have, empty entries and files named for a culture .NET does not know. It also
      # reports how much of each language is done, and how much text is still in the XAML.
      - name: Translations check
        run: dotnet run --project tools/LocCheck/LocCheck.csproj -c Release

      # ⚠️ Do the Planetary Industry forecasts still add up? ESI shows a colony only as of the
      # last time its owner looked at it, so every "storage full at" and "inputs run out at" is
      # simulated, and a wrong one shows as a confident date, not as an error. Tax learning has no
      # real journal entries to be checked against at all. This runs the engine on constructed
      # colonies against the published yield formula, hand arithmetic and conservation, and
      # learns a tax rate through a throwaway database.
      - name: PI engine check
        run: dotnet run --project tools/PiEngineCheck/PiEngineCheck.csproj -c Release

      # ⚠️ Does the job planner still give a reaction slot to the item a hull is actually waiting
      # on? Slots go out in ranking order, so a ranking that favours stocked items over an empty
      # one looks like a full list, not an error: every racial composite sat at zero with no job
      # while broad, part-stocked intermediates took all 131 slots. This checks, on a constructed
      # chain, that a waiting final counts only for its most-starved input.
      - name: Worklist rank check
        run: dotnet run --project tools/WorklistRankCheck/WorklistRankCheck.csproj -c Release

  # ⚠️ Does the Linux target still compile?
  #
  # The job above answers that for Windows only — it is a windows-latest runner with no
  # RuntimeIdentifier, so it builds for its own host and nothing else. A package placed in
  # the IsWindowsTarget ItemGroup therefore vanishes from a Linux build without this check
  # noticing: Npgsql landed there in #89, the PR went green, and develop could not be built
  # on Linux at all (12 CS0246s).
  #
  # Nothing else catches it first. release-build.yml has a linux job, but that only runs
  # once develop has already reached main.
  #
  # A real runner rather than `-r linux-x64` from the Windows one: the piper download
  # targets in EveConsole.csproj are conditioned on the build HOST, so cross-compiling
  # produces an artifact that is not the one the release job produces.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # libvlc is the one dependency the app cannot carry itself — LibVLCSharp loads the
      # system copy. release-build.yml installs it on its linux job for the same reason.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev

      - name: Restore
        run: dotnet restore EveConsole.csproj

      - name: Build
        run: dotnet build EveConsole.csproj -c Release --no-restore

      # ⚠️ Does --headless start where there is no display? It did not: the worker set Avalonia up
      # on the desktop platform, which opens an X11 display on Linux, and under Docker it died
      # before reaching any of our code. Nothing on Windows can show that, and nor can a desktop.
      #
      # So the worker is run the way a self-hoster runs it: packaging/docker's compose file, its
      # image and its PostgreSQL server, with this build's binary in place of the released one
      # (.github/docker-compose.ci.yml). The image is the real test — no display, no fontconfig,
      # no keyring, an unprivileged user — and building it also checks the Dockerfile itself.
      #
      # Passing means: it starts, opens a fresh PostgreSQL database, holds the lease, and on
      # SIGTERM (docker stop) says so and exits 0 inside the grace period. An exit by SIGKILL
      # (137) is a worker that ignored the signal and never released its lease.
      - name: Publish (self-contained linux-x64)
        run: dotnet publish EveConsole.csproj -c Release -r linux-x64 --self-contained true -o publish-linux

      - name: Docker compose file is valid
        run: POSTGRES_PASSWORD=ci docker compose -f packaging/docker/docker-compose.yml config -q

      - name: Headless worker runs against the compose file's PostgreSQL
        working-directory: packaging/docker
        env:
          POSTGRES_PASSWORD: ci-only
          PUBLISH_DIR: ${{ github.workspace }}/publish-linux
        run: |
          chmod +x "$PUBLISH_DIR/EveConsole"
          compose="docker compose -f docker-compose.yml -f $GITHUB_WORKSPACE/.github/docker-compose.ci.yml"
          $compose up -d --build
          # ⚠️ The log goes to a file and grep reads the file. The step's shell runs with pipefail,
          # and `compose logs | grep -q` fails whenever grep stops reading before compose has
          # finished writing.
          for i in $(seq 1 90); do
            $compose logs worker > worker.log 2>&1
            grep -q "holds the lease" worker.log && break
            [ "$(docker inspect -f '{{.State.Running}}' "$($compose ps -aq worker)")" = false ] && break
            sleep 2
          done
          $compose stop -t 30 worker
          $compose logs worker > worker.log 2>&1
          cat worker.log
          code=$(docker inspect -f '{{.State.ExitCode}}' "$($compose ps -aq worker)")
          echo "worker exit code: $code"
          grep -q "database   PostgreSQL" worker.log
          grep -q "this process holds the lease" worker.log
          grep -q "Stopping" worker.log
          test "$code" = 0

      # The worker has just built the whole schema in an empty database, and that database is
      # still running — the one place in CI with every table PostgreSQL will see. So PgSqlCheck
      # PREPAREs every hand-written statement against it.
      #
      # ⚠️ --collisions is the reason it runs here. The SDE import adds a column to an Sde table
      # for every field CCP adds to a file, on users' machines, with no release of ours in
      # between; a statement naming a column bare beside an Sde table is then one CCP field away
      # from "ambiguous" — or, in a subquery, from quietly reading the new column instead of the
      # one it meant. No schema this build can make shows that, so the pass gives every Sde table
      # a column for every name the code quotes, checks everything again, and rolls it all back.
      - name: SQL typechecks on PostgreSQL and survives new SDE columns
        env:
          EVECONSOLE_PG: Host=localhost;Port=5432;Database=eveconsole;Username=eveconsole;Password=ci-only
        run: dotnet run --project tools/PgSqlCheck/PgSqlCheck.csproj -c Release -- --collisions .
