name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $majorMinor = (Get-Content VERSION -Raw).Trim()
          $tags = git tag -l "v$majorMinor.*"
          if ($tags) {
            $patches = $tags | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($majorMinor))\.", "") }
            $nextPatch = ($patches | Measure-Object -Maximum).Maximum + 1
          } else {
            $nextPatch = 0
          }
          $version = "$majorMinor.$nextPatch"
          Write-Output "Computed version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish EveCortex.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pull the previous release so Velopack can generate a delta package (first run is a no-op).
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId EveCortex
          --packTitle "Eve Cortex"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe EveCortex.exe

      - name: Upload to GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --publish
          --releaseName "Eve Cortex v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}

      - name: Add install notes to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $notes = @(
            '## Installing',
            '',
            '- **Installer (recommended):** download `EveCortex-win-Setup.exe` and run it. It installs Eve Cortex and keeps it updated automatically.',
            '- **Portable:** download `EveCortex-win-Portable.zip`, extract it anywhere, and run `EveCortex.exe`.',
            '',
            'No .NET install is required — the runtime is bundled.',
            '',
            '### First launch (Windows SmartScreen)',
            'Eve Cortex is not code-signed yet, so Windows may show a "Windows protected your PC" warning the first time you run it. This is expected for a new indie app.',
            '',
            '- If the warning appears, click **More info**, then **Run anyway**.',
            '- To avoid it entirely: right-click the downloaded file -> **Properties** -> tick **Unblock** -> **OK** before running.'
          ) -join "`n"
          gh release edit $tag --notes $notes
