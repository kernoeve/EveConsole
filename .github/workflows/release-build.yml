name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $majorMinor = (Get-Content VERSION -Raw).Trim()
          $tags = git tag -l "v$majorMinor.*"
          if ($tags) {
            $patches = $tags | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($majorMinor))\.", "") }
            $nextPatch = ($patches | Measure-Object -Maximum).Maximum + 1
          } else {
            $nextPatch = 0
          }
          $version = "$majorMinor.$nextPatch"
          Write-Output "Computed version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish EveCortex.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o EveCortex

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $zip = "EveCortex-v${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "EveCortex" -DestinationPath $zip -Force
          Write-Output "Created $zip"
          echo "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Tag release
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag "${{ steps.package.outputs.zip }}" --title "Eve Cortex $tag" --generate-notes
          $auto = gh release view $tag --json body -q .body
          $header = @(
            '## Installing',
            '',
            'Download the win-x64 zip below and extract it anywhere, then run `EveCortex.exe`. No .NET install is required (the runtime is bundled).',
            '',
            '### First launch (Windows SmartScreen)',
            'Eve Cortex is not code-signed yet, so Windows may show a "Windows protected your PC" warning the first time you run it. This is expected for a new indie app.',
            '',
            '- If the warning appears, click **More info**, then **Run anyway**.',
            '- Optional: before extracting the zip, right-click it -> **Properties** -> tick **Unblock** -> **OK**. This clears the download flag from every file inside.',
            '',
            '---',
            ''
          ) -join "`n"
          gh release edit $tag --notes ($header + "`n" + $auto)
