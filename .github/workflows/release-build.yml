name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $majorMinor = (Get-Content VERSION -Raw).Trim()
          $tags = git tag -l "v$majorMinor.*"
          if ($tags) {
            $patches = $tags | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($majorMinor))\.", "") }
            $nextPatch = ($patches | Measure-Object -Maximum).Maximum + 1
          } else {
            $nextPatch = 0
          }
          $version = "$majorMinor.$nextPatch"
          Write-Output "Computed version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish EveCortex.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pull the previous release so Velopack can generate a delta package (first run is a no-op).
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId EveCortex
          --packTitle "Eve Cortex"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe EveCortex.exe

      - name: Upload to GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --publish
          --releaseName "Eve Cortex v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}
