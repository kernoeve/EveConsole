name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The Linux job needs the same number, and must not compute it again: the tag it derives
    # from already exists by then, so a second run of the same arithmetic returns the NEXT
    # patch and the two halves of one release would disagree about what they are.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $majorMinor = (Get-Content VERSION -Raw).Trim()
          $tags = git tag -l "v$majorMinor.*"
          if ($tags) {
            $patches = $tags | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($majorMinor))\.", "") }
            $nextPatch = ($patches | Measure-Object -Maximum).Maximum + 1
          } else {
            $nextPatch = 0
          }
          $version = "$majorMinor.$nextPatch"
          Write-Output "Computed version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish EveConsole.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pull the previous release so Velopack can generate a delta package (first run is a no-op).
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      # --icon is for Setup.exe and Update.exe, which otherwise carry Velopack's own. The app's
      # own shortcut takes its icon from the executable, which already has one through
      # ApplicationIcon in the csproj.
      - name: Pack Velopack release
        run: >
          vpk pack
          --packId EveConsole
          --packTitle "EVE Console"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe EveConsole.exe
          --icon Assets\ec.ico

      - name: Upload to GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --publish
          --releaseName "EVE Console v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}

      - name: Set release notes (changelog + install)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $install = @(
            '## Installing',
            '',
            '- **Installer (recommended):** download `EveConsole-win-Setup.exe` and run it. It installs EVE Console and keeps it updated automatically.',
            '- **Portable:** download `EveConsole-win-Portable.zip`, extract it anywhere, and run `EveConsole.exe`.',
            '',
            '### Linux',
            '',
            '- **AppImage:** download the `.AppImage`, `chmod +x` it, and run it. It keeps itself updated.',
            '- **Tarball:** download `EveConsole-linux-x64.tar.gz`, extract it anywhere, and run `./EveConsole`.',
            '',
            'Alarm sounds and speech need VLC on the system — the `vlc` package on most',
            'distributions (Debian and Ubuntu also accept `libvlc-dev`). It is the one piece the',
            'build cannot carry itself; everything else works without it.',
            '',
            'No .NET install is required on either platform — the runtime is bundled.',
            '',
            '### First launch (Windows SmartScreen)',
            'EVE Console is not code-signed yet, so Windows may show a "Windows protected your PC" warning the first time you run it. This is expected for a new indie app.',
            '',
            '- If the warning appears, click **More info**, then **Run anyway**.',
            '- To avoid it entirely: right-click the downloaded file -> **Properties** -> tick **Unblock** -> **OK** before running.'
          ) -join "`n"
          # Carry the merged (develop -> main) PR description through as the changelog.
          $prBody = gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""'
          if ([string]::IsNullOrWhiteSpace($prBody)) {
            $notes = $install
          } else {
            $notes = $prBody.TrimEnd() + "`n`n---`n`n" + $install
          }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          gh release edit $tag --notes-file release_notes.md

  # ══ Linux ═════════════════════════════════════════════════════════════════
  #
  # ⚠️ A separate job on a Linux runner, not a second publish from the Windows one.
  # Velopack's packer is platform-specific: `vpk pack` produces an AppImage only when it runs
  # on Linux, and there is no cross-target equivalent.
  #
  # ⚠️ Runs after the Windows job rather than beside it. That job creates the release and the
  # tag; this one adds to what already exists. In parallel they would race to create it.
  # A failure here therefore costs the Linux artifacts, not the Windows release.
  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # libvlc is the one dependency the app cannot carry itself — LibVLCSharp loads the
      # system copy. Needed on the runner so the build's own checks can see it; users install
      # it through their own package manager.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish (self-contained linux-x64)
        run: >
          dotnet publish EveConsole.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:Version=${{ needs.build.outputs.version }}
          -o publish-linux

      # The plain tarball: extract anywhere and run. No install step, no update mechanism —
      # the option for anyone who would rather not have either.
      - name: Build tarball
        run: |
          chmod +x publish-linux/EveConsole
          tar -czf EveConsole-linux-x64.tar.gz -C publish-linux .

      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v${{ needs.build.outputs.version }} EveConsole-linux-x64.tar.gz --clobber

      # Velopack again, for the AppImage and the Linux update feed. It keeps its own
      # releases.linux.json alongside the Windows one, so the two do not overwrite each other.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }}

      # ⚠️ --icon, or the AppImage gets Velopack's placeholder — an upside-down triangle, which is
      # what shipped until somebody ran one and noticed. Nothing carries it implicitly here: the
      # Windows build has its icon compiled into the executable through ApplicationIcon and there
      # is no equivalent on Linux, so the packer has to be handed one. logo_mark rather than logo,
      # because the full logo has the "EVE Console" wordmark across it and that is illegible at 32
      # pixels.
      - name: Pack Velopack release
        run: >
          vpk pack
          --packId EveConsole
          --packTitle "EVE Console"
          --packVersion ${{ needs.build.outputs.version }}
          --packDir publish-linux
          --mainExe EveConsole
          --icon Assets/logo_mark.png

      - name: Upload to the existing GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --releaseName "EVE Console v${{ needs.build.outputs.version }}"
          --tag v${{ needs.build.outputs.version }}

  # ══ Announce ══════════════════════════════════════════════════════════════
  #
  # ⚠️ A job in THIS workflow rather than a separate one on `release: published`. The release is
  # created by vpk with GITHUB_TOKEN, and GitHub deliberately raises no workflow-triggering event
  # for anything GITHUB_TOKEN does — a `release` workflow would never run, and would look like a
  # broken webhook rather than a trigger that cannot fire.
  announce:
    needs: [build, linux]
    # ⚠️ always(), so this still runs when the Linux job failed. That job's own note says its
    # failure costs the Linux artifacts and not the release; a good Windows release that nobody
    # hears about is the worse outcome. The guard keeps it to releases that actually happened.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to Discord
        env:
          # ⚠️ Through env, not ${{ }} inside the script. Release notes are text this workflow did
          # not write, and interpolating them into a shell line makes them executable.
          WEBHOOK:  ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG:      v${{ needs.build.outputs.version }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail

          # A fork, or a repository where nobody has set the secret, still releases normally.
          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not set — nothing announced."
            exit 0
          fi

          notes=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)

          # The notes are "<changelog>\n\n---\n\n<install instructions>". Only the changelog is
          # worth announcing: the install half is identical every release and the embed links
          # straight to it. Split on the LAST '---' rather than the first, so a horizontal rule
          # inside the changelog does not truncate it.
          changelog=$(printf '%s\n' "$notes" | awk '
            { line[NR] = $0; if ($0 == "---") last = NR }
            END { stop = (last ? last - 1 : NR); for (i = 1; i <= stop; i++) print line[i] }')

          if [ -z "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
            changelog="_No changelog recorded for this release._"
          fi

          # jq builds the JSON, so quotes and newlines in the notes cannot break the payload, and
          # the truncation counts codepoints rather than bytes — slicing 4096 BYTES could cut a
          # character in half and produce invalid UTF-8. Discord's embed description caps at 4096.
          payload=$(jq -n \
            --arg title "EVE Console $TAG" \
            --arg url   "https://github.com/$REPO/releases/tag/$TAG" \
            --arg body  "$changelog" \
            '{
               username: "EVE Console",
               embeds: [{
                 title:       $title,
                 url:         $url,
                 description: (if ($body | length) > 3800
                               then ($body | .[0:3800]) + "\n\n…"
                               else $body
                               end),
                 color:       13150283
               }]
             }')

          # -f so a refusal fails the step: an announcement that silently did not happen is the
          # thing this job exists to prevent.
          curl -sS -f -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
          echo "Announced $TAG to Discord."
